<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lift Log</title>
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
:root{--bg:#0f1115;--card:#181b22;--card2:#20242d;--line:#2a2f3a;--text:#eef0f4;--mute:#8b93a3;--acc:#4ade80;--accd:#14532d;--bad:#f87171;--warn:#fbbf24}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,system-ui,Segoe UI,Roboto,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:6px 0 2px}
h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:22px 0 8px;font-weight:600}
.sub{color:var(--mute);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.row{display:flex;align-items:center;gap:10px}
.sp{justify-content:space-between}
.name{font-weight:650;font-size:17px}
.wt{font-size:26px;font-weight:700;white-space:nowrap}
.wt small{font-size:14px;color:var(--mute);font-weight:500}
.plates{color:var(--mute);font-size:13px;margin-top:2px}
button{font:inherit;color:var(--text);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer}
button:active{transform:scale(.97)}
button.pri{background:var(--acc);color:#062b12;border-color:var(--acc);font-weight:700;width:100%;padding:14px;font-size:17px}
button.ghost{background:transparent}
button.danger{color:var(--bad)}
button.sm{padding:6px 10px;font-size:14px;border-radius:10px}
.sets{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.set{width:54px;height:54px;border-radius:50%;padding:0;font-size:18px;font-weight:700;background:var(--card2);color:var(--mute);flex:none}
.set.done{background:var(--acc);color:#062b12;border-color:var(--acc)}
.set.part{background:var(--warn);color:#2b1d00;border-color:var(--warn)}
.set.zero{background:var(--bad);color:#2b0000;border-color:var(--bad)}
.slot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.slot.drop{padding-left:16px}
.slot:first-of-type{border-top:0}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:#12151b;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:5}
.tabs button{flex:1;background:transparent;border:0;color:var(--mute);padding:10px 2px;font-size:13px}
.tabs button.on{color:var(--acc);font-weight:700}
input,textarea,select{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
select{appearance:auto}
label{font-size:12px;color:var(--mute);display:block;margin-bottom:3px}
.g2,.g3,.g4{display:grid;gap:8px;margin-top:10px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}.g4{grid-template-columns:repeat(4,1fr)}
.chips{display:flex;gap:6px;margin-top:10px;align-items:center;flex-wrap:wrap}
.chip{padding:5px 12px;border-radius:999px;font-size:14px}
.chip.on{background:var(--accd);border-color:var(--acc);color:var(--acc)}
.rest{position:fixed;left:12px;right:12px;bottom:calc(66px + env(safe-area-inset-bottom));background:var(--accd);border:1px solid var(--acc);border-radius:14px;padding:10px 14px;display:none;align-items:center;justify-content:space-between;z-index:6}
.rest b{font-size:20px}
.note{background:#2b2410;border:1px solid #5b4a14;color:#f3dd9a;border-radius:12px;padding:10px 12px;font-size:14px;margin:10px 0}
.hist .ln{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:3px 0;color:var(--mute)}
.hist .ln b{color:var(--text);font-weight:600}
.ok{color:var(--acc)} .no{color:var(--bad)}
textarea{min-height:96px;font:12px/1.3 ui-monospace,Menlo,monospace;word-break:break-all}
.status{font-size:12px;color:var(--mute);text-align:center;margin-top:18px}
.mv{display:flex;gap:4px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.cal .dh{text-align:center;font-size:12px;color:var(--mute);padding:2px 0}
.gnote{background:#10261a;border:1px solid #1f5a35;color:#9be8b8;border-radius:12px;padding:10px 12px;font-size:14px;margin:10px 0}
.cd{aspect-ratio:1;border-radius:10px;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;line-height:1.1;background:transparent;border:1px solid transparent;color:var(--mute);cursor:default}
.cd.on{background:var(--acc);border-color:var(--acc);color:#062b12;font-weight:700;cursor:pointer}
.cd .tk{color:var(--acc);font-size:13px;font-weight:700}
.cd.today{border-color:var(--mute)}
.cd.sel{outline:2px solid var(--acc);outline-offset:1px}
.cd.empty{visibility:hidden}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="rest" id="rest"><span>Rest <b id="restT">0:00</b></span><button class="sm" data-act="skiprest">Skip</button></div>
<nav class="tabs" id="tabs"></nav>

<script>
(function(){
'use strict';
var KEY='liftlog.v2';
function mkLift(id,name,w,inc,sets,reps){return {id:id,name:name,weight:w,bar:'b1',scheme:'straight',sets:sets,reps:reps,drops:{n:2,by:20,unit:'pct',reps:8},prog:'weight',inc:inc,repsMin:reps,repsMax:reps+3,failsMax:3,deload:10,fails:0};}
var DEF={v:2,rest:180,confirmed:false,updated:0,
  bars:[{id:'b1',name:'Barbell',weight:6.25}],
  plates:[{w:20,n:2},{w:10,n:2},{w:5,n:2},{w:2.5,n:2},{w:1.25,n:2}],
  lifts:[mkLift('sq','Squat',60,2.5,3,5),mkLift('bp','Bench Press',40,2.5,3,5),mkLift('row','Barbell Row',40,2.5,3,5),mkLift('ohp','Overhead Press',30,2.5,3,5),mkLift('dl','Deadlift',80,5,1,5)],
  liftDays:[],
  days:[{id:'d1',name:'Workout A',lifts:['sq','bp','row']},{id:'d2',name:'Workout B',lifts:['sq','ohp','dl']}],
  next:'d1',history:[],active:null};
var now0=new Date(),calY=now0.getFullYear(),calM=now0.getMonth(),calSel=null,S=null,tab='today',saveT=null,restEnd=0,cache={};

function clone(o){return JSON.parse(JSON.stringify(o));}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fmt(n){return String(Math.round(n*100)/100);}
function r25(x){return Math.round(x*4)/4;}
function lift(id){return S.lifts.filter(function(l){return l.id===id;})[0];}
function dayOf(id){return S.days.filter(function(d){return d.id===id;})[0]||S.days[0];}
var NOBAR={id:'none',name:'No bar',weight:0,none:true};
function barOf(cfg){if(cfg.bar==='none')return NOBAR;return S.bars.filter(function(b){return b.id===cfg.bar;})[0]||S.bars[0]||{id:'',name:'Bar',weight:0};}
function wtHtml(cfg,w){var n=barOf(cfg).none;return n&&w<=0?'BW':(n?'+':'')+fmt(w)+'<small>kg</small>';}
function wlab(cfg,w){var n=barOf(cfg).none;return n&&w<=0?'Bodyweight':(n?'+':'')+fmt(w)+' kg';}

// ---------- equipment: every loadable weight ----------
function loadMap(barW,none){
  var key=(none?'N':barW)+'|'+S.plates.map(function(p){return p.w+'x'+p.n;}).join(',');
  if(cache[key])return cache[key];
  var types=S.plates.filter(function(p){return p.w>0&&(none?p.n:Math.floor(p.n/2))>0;}).map(function(p){return {w:p.w,k:none?p.n:Math.floor(p.n/2)};}).sort(function(a,b){return b.w-a.w;});
  var dp={0:[]};
  types.forEach(function(t){
    var nd=Object.assign({},dp);
    Object.keys(dp).forEach(function(k){
      var base=dp[k],s=+k;
      for(var j=1;j<=t.k;j++){
        var ns=s+Math.round(t.w*100)*j,combo=base.concat(new Array(j).fill(t.w));
        if(!nd[ns]||nd[ns].length>combo.length)nd[ns]=combo;
      }
    });
    dp=nd;
  });
  var list=Object.keys(dp).map(function(k){return {total:Math.round((barW+(none?1:2)*(+k)/100)*100)/100,combo:dp[k]};}).sort(function(a,b){return a.total-b.total;});
  if(Object.keys(cache).length>12)cache={};
  cache[key]=list;
  return list;
}
function snap(cfg,w){
  var b=barOf(cfg),list=loadMap(b.weight,!!b.none),lo=0,hi=list.length-1;
  while(lo<hi){var mid=(lo+hi)>>1;if(list[mid].total<w)lo=mid+1;else hi=mid;}
  var best=list[lo];
  if(lo>0&&Math.abs(list[lo-1].total-w)<=Math.abs(best.total-w))best=list[lo-1];
  return best;
}
function plan(cfg,ideal){
  var b=barOf(cfg),r=snap(cfg,ideal),t;
  if(b.none)t=r.total<=0?'Bodyweight':'Add: '+r.combo.join(' + ')+' kg (belt or vest)';
  else t=(r.combo.length?'Each side: '+r.combo.join(' + '):'Bar only')+' · bar '+fmt(b.weight);
  if(Math.abs(r.total-ideal)>0.01)t+=' · wanted '+fmt(ideal);
  return t;
}

// ---------- persistence: stored in this browser, on this device ----------
function localLoad(){try{var s=localStorage.getItem(KEY);return s?JSON.parse(s):null;}catch(e){return null;}}
function localSave(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

// ---------- account sync (Firebase: Google sign-in + Firestore) ----------
var CFG={apiKey:"AIzaSyDeJvechQpEbTtLJry8A5lwXWch1PsLLTs",authDomain:"lift-log-50384.firebaseapp.com",projectId:"lift-log-50384",storageBucket:"lift-log-50384.firebasestorage.app",messagingSenderId:"64016188516",appId:"1:64016188516:web:b8868dffdb89472b518b71"};
var fb=null,user=null,syncState='local',syncMsg='',authMsg='',dirty=false,pushT=null;
function withTimeout(p,ms){return Promise.race([p,new Promise(function(_,rej){setTimeout(function(){rej({code:'timeout'});},ms);})]);}
function statusText(){
  if(!user)return syncState==='unavailable'?'Sync unavailable right now. Saved on this device.':'Not signed in. Saved on this device only.';
  if(syncState==='synced')return 'Synced to your account';
  if(syncState==='offline')return 'Changes waiting to sync';
  if(syncState==='error')return 'Sync problem: '+syncMsg;
  return 'Syncing…';
}
function paintStatus(){['stat','acctStat'].forEach(function(id){var e=document.getElementById(id);if(e)e.textContent=statusText();});}
function fail(e){var c=(e&&e.code)||'unknown';if(c==='timeout'||c==='unavailable'){syncState='offline';}else{syncState='error';syncMsg=c;}}
async function push(){
  if(!user||!fb)return;
  try{
    var c=clone(S);c.active=null;c.history=c.history.slice(0,500);
    await withTimeout(fb.F.setDoc(fb.F.doc(fb.db,'users',user.uid),{json:JSON.stringify(c),updated:S.updated||Date.now()}),8000);
    dirty=false;syncState='synced';
  }catch(e){dirty=true;fail(e);}
  paintStatus();
}
async function pull(){
  if(!user||!fb)return;
  try{
    var snap=await withTimeout(fb.F.getDoc(fb.F.doc(fb.db,'users',user.uid)),8000);
    if(snap.exists()){
      var d=snap.data(),ru=d.updated||0;
      if(ru>(S.updated||0)){
        var remote=fix(JSON.parse(d.json));
        if(remote&&!S.active){remote.active=null;remote.updated=ru;S=remote;localSave();render();}
        syncState='synced';
      }else if((S.updated||0)>ru){await push();return;}
      else syncState='synced';
    }else{await push();return;}
  }catch(e){fail(e);}
  paintStatus();
}
function save(){
  S.updated=Date.now();localSave();
  if(user&&fb){dirty=true;syncState='syncing';paintStatus();clearTimeout(pushT);pushT=setTimeout(push,1500);}
}
async function initFirebase(){
  try{
    var base='https://www.gstatic.com/firebasejs/10.14.1/';
    var A=await import(base+'firebase-app.js'),Au=await import(base+'firebase-auth.js'),F=await import(base+'firebase-firestore.js');
    var app=A.initializeApp(CFG);
    fb={Au:Au,F:F,auth:Au.getAuth(app),db:F.getFirestore(app)};
    Au.onAuthStateChanged(fb.auth,function(u){
      user=u;syncState=u?'syncing':'local';authMsg='';paintStatus();
      if(tab==='backup')render();
      if(u)pull();
    });
  }catch(e){syncState='unavailable';paintStatus();}
}
async function signIn(){
  if(!fb){authMsg='Sign-in is not available right now. Check your connection and reload.';render();return;}
  try{await fb.Au.signInWithPopup(fb.auth,new fb.Au.GoogleAuthProvider());}
  catch(e){var c=(e&&e.code)||'failed';authMsg=c==='auth/popup-closed-by-user'||c==='auth/cancelled-popup-request'?'':'Sign-in failed ('+c+').';render();}
}
async function signOutNow(){try{await fb.Au.signOut(fb.auth);}catch(e){}}
function fix(o){ // fill any missing fields so older/odd data cannot break the page
  if(!o||o.v!==2||!Array.isArray(o.lifts)||!Array.isArray(o.bars)||!Array.isArray(o.plates)||!Array.isArray(o.days))return null;
  o.history=Array.isArray(o.history)?o.history:[];o.active=o.active||null;o.rest=o.rest||180;
  o.lifts.forEach(function(l){var d=mkLift(l.id,l.name,l.weight,l.inc||2.5,l.sets||3,l.reps||5);Object.keys(d).forEach(function(k){if(l[k]===undefined)l[k]=d[k];});});
  if(!Array.isArray(o.liftDays)){var u=[];o.days.forEach(function(d){(d.weekdays||[]).forEach(function(w){if(u.indexOf(w)<0)u.push(w);});});o.liftDays=u;}
  o.days.forEach(function(d){delete d.weekdays;});
  if(!o.days.some(function(d){return d.id===o.next;}))o.next=o.days[0]?o.days[0].id:'';
  return o;
}
function boot(){S=fix(localLoad())||clone(DEF);render();initFirebase();}

// ---------- workout logic ----------
function buildSlots(cfg,base,reps){
  var out=[],n=Math.max(1,cfg.sets|0);
  for(var s=0;s<n;s++){
    out.push({w:snap(cfg,base).total,ideal:base,reps:reps,drop:false,lab:'Set '+(s+1),done:null});
    if(cfg.scheme==='drop'&&cfg.drops){
      var cur=base;
      for(var d=0;d<(cfg.drops.n|0);d++){
        cur=cfg.drops.unit==='kg'?cur-cfg.drops.by:cur*(1-cfg.drops.by/100);
        cur=Math.max(0,cur);
        out.push({w:snap(cfg,cur).total,ideal:cur,reps:cfg.drops.reps,drop:true,lab:'Drop '+(d+1),done:null});
      }
    }
  }
  return out;
}
function startWorkout(did){
  var day=dayOf(did);if(!day)return;
  var entries=day.lifts.map(lift).filter(Boolean).map(function(l){
    var cfg=clone(l);delete cfg.name;
    return {id:l.id,name:l.name,cfg:cfg,base:l.weight,reps:l.reps,slots:buildSlots(cfg,l.weight,l.reps)};
  });
  if(!entries.length)return;
  S.active={day:day.id,dayName:day.name,start:Date.now(),entries:entries};
  save();render();
}
function tapSet(ei,si){
  var e=S.active.entries[ei],s=e.slots[si],v=s.done;
  if(v===null)v=s.reps;else if(v>0)v=v-1;else v=null;
  s.done=v;
  var nx=e.slots[si+1];
  if(v!==null&&!(nx&&nx.drop)){restEnd=Date.now()+S.rest*1000;showRest();}
  save();render();
}
function nudge(ei,dir){
  var e=S.active.entries[ei],step=e.cfg.inc>0?e.cfg.inc:2.5;
  e.base=Math.max(0,r25(e.base+dir*step));
  var fresh=buildSlots(e.cfg,e.base,e.reps);
  fresh.forEach(function(s,i){if(e.slots[i])s.done=e.slots[i].done;});
  e.slots=fresh;save();render();
}
function finishWorkout(){
  var a=S.active,rec={date:new Date().toISOString(),day:a.dayName,entries:[]};
  a.entries.forEach(function(e){
    if(!e.slots.some(function(s){return s.done!==null;}))return;
    var ok=e.slots.every(function(s){return s.done!==null&&s.done>=s.reps;}),l=lift(e.id);
    rec.entries.push({name:e.name,none:!!barOf(e.cfg).none,base:e.base,ok:ok,slots:e.slots.map(function(s){return {w:s.w,reps:s.reps,done:s.done||0};})});
    if(!l)return;
    l.weight=e.base;
    if(l.prog==='none')return;
    if(ok){
      l.fails=0;
      if(l.prog==='double'){
        if(l.reps<l.repsMax)l.reps=l.reps+1;
        else{l.weight=r25(e.base+l.inc);l.reps=l.repsMin;}
      }else l.weight=r25(e.base+l.inc);
    }else{
      l.fails=(l.fails||0)+1;
      if(l.failsMax>0&&l.fails>=l.failsMax){l.weight=r25(e.base*(1-l.deload/100));l.fails=0;if(l.prog==='double')l.reps=l.repsMin;}
    }
  });
  if(rec.entries.length)S.history.unshift(rec);
  var i=S.days.map(function(d){return d.id;}).indexOf(a.day);
  S.next=S.days[(i+1)%S.days.length].id;
  S.active=null;restEnd=0;hideRest();
  pickDay=null;restOverride=false;var nn=new Date();calY=nn.getFullYear();calM=nn.getMonth();calSel=null;
  save();tab='history';render();
}

// ---------- rest timer ----------
function showRest(){document.getElementById('rest').style.display='flex';tickRest();}
function hideRest(){document.getElementById('rest').style.display='none';}
function tickRest(){
  if(!restEnd){hideRest();return;}
  var s=Math.max(0,Math.round((restEnd-Date.now())/1000));
  document.getElementById('restT').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
  if(s<=0){restEnd=0;setTimeout(hideRest,1500);}
}
setInterval(tickRest,500);

// ---------- views ----------
function spark(vals){
  if(vals.length<2)return '';
  var w=110,h=26,mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),rg=(mx-mn)||1;
  var pts=vals.map(function(v,i){return (i/(vals.length-1)*w).toFixed(1)+','+(h-2-((v-mn)/rg)*(h-4)).toFixed(1);}).join(' ');
  return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'"><polyline fill="none" stroke="#4ade80" stroke-width="2" points="'+pts+'"/></svg>';
}
function summary(l){
  return l.scheme==='drop'&&l.drops?l.sets+' × '+l.reps+' + '+l.drops.n+' drop'+(l.drops.n===1?'':'s')+' × '+l.drops.reps:l.sets+' × '+l.reps;
}
var pickDay=null,restOverride=false,WD=[['M',1],['T',2],['W',3],['T',4],['F',5],['S',6],['S',0]];
function isLiftDay(){return S.liftDays.length===0||S.liftDays.indexOf(new Date().getDay())>-1;}
function curDayId(){
  if(pickDay&&S.days.some(function(d){return d.id===pickDay;}))return pickDay;
  return dayOf(S.next)?dayOf(S.next).id:null;
}
function vToday(){
  var h='';
  if(!S.confirmed)h+='<div class="note">Before you start, check <b>Gear</b> (your bar and plates) and <b>Template</b> (lifts, sets, weights). The values there are placeholders.<br><button class="sm" style="margin-top:8px" data-act="confirm">All set up</button></div>';
  if(S.history.length>0&&(!S.lastBackup||Date.now()-S.lastBackup>30*864e5))h+='<div class="note">You haven\'t backed up lately. A quick backup on the <b>Account</b> tab protects your history.</div>';
  if(S.active){
    var a=S.active;
    h+='<h1>'+esc(a.dayName)+'</h1><div class="sub">Tap a set when done. Tap again to drop a rep, and again to clear it.</div>';
    a.entries.forEach(function(e,ei){
      h+='<div class="card"><div class="row sp"><div><div class="name">'+esc(e.name)+'</div><div class="sub">'+esc(summary(Object.assign({},e.cfg,{reps:e.reps})))+'</div></div>'
        +'<div class="row"><button class="sm" data-act="wdown" data-i="'+ei+'">−</button><div class="wt">'+wtHtml(e.cfg,e.base)+'</div><button class="sm" data-act="wup" data-i="'+ei+'">+</button></div></div>';
      if(e.cfg.scheme!=='drop'){
        h+='<div class="plates">'+esc(plan(e.cfg,e.slots[0].ideal))+'</div><div class="sets">';
        e.slots.forEach(function(s,si){h+=setBtn(s,ei,si);});
        h+='</div>';
      }else{
        h+='<div style="margin-top:8px">';
        e.slots.forEach(function(s,si){
          h+='<div class="slot'+(s.drop?' drop':'')+'"><div><b>'+esc(s.lab)+'</b> <span class="sub">'+esc(wlab(e.cfg,s.w))+' × '+s.reps+'</span><div class="plates">'+esc(plan(e.cfg,s.ideal))+'</div></div>'+setBtn(s,ei,si)+'</div>';
        });
        h+='</div>';
      }
      h+='</div>';
    });
    h+='<button class="pri" data-act="finish">Finish workout</button><div style="height:10px"></div><button class="ghost danger" style="width:100%" data-act="cancel">Cancel workout</button>';
  }else{

function copyFrom(id,b){

document.addEventListener('click',function(ev){
  var tb=ev.target.closest('[data-tab]');
  if(tb){tab=tb.getAttribute('data-tab');render();window.scrollTo(0,0);return;}
  var b=ev.target.closest('[data-act]');if(!b)return;
  var act=b.getAttribute('data-act'),i=+b.getAttribute('data-i'),id=b.getAttribute('data-id'),d=b.getAttribute('data-d');
  function sure(label){if(b.getAttribute('data-sure')!=='1'){b.setAttribute('data-sure','1');b.textContent=label||'Tap again to delete';return false;}return true;}
  if(act==='start'){var cd=curDayId();if(cd)startWorkout(cd);}
  else if(act==='day'){pickDay=id;S.next=id;save();render();}
  else if(act==='wkday'){var w=+b.getAttribute('data-w'),wi=S.liftDays.indexOf(w);if(wi>-1)S.liftDays.splice(wi,1);else S.liftDays.push(w);save();render();}
  else if(act==='trainanyway'){restOverride=true;render();}
  else if(act==='set')tapSet(i,+b.getAttribute('data-s'));
  else if(act==='wup')nudge(i,1);
  else if(act==='wdown')nudge(i,-1);
  else if(act==='finish')finishWorkout();
  else if(act==='cancel'){if(!sure('Tap again to cancel'))return;S.active=null;restEnd=0;hideRest();save();render();}
  else if(act==='skiprest'){restEnd=0;hideRest();}
  else if(act==='confirm'){S.confirmed=true;save();render();}
  else if(act==='dayset'){var day=dayOf(d),k=day.lifts.indexOf(id);if(k>-1)day.lifts.splice(k,1);else day.lifts.push(id);save();render();}
  else if(act==='up'||act==='dn'){var j=S.lifts.map(function(l){return l.id;}).indexOf(id),t=act==='up'?j-1:j+1;if(t>=0&&t<S.lifts.length){var x=S.lifts[j];S.lifts[j]=S.lifts[t];S.lifts[t]=x;save();render();}}
  else if(act==='del'){if(!sure())return;S.lifts=S.lifts.filter(function(l){return l.id!==id;});S.days.forEach(function(dd){dd.lifts=dd.lifts.filter(function(y){return y!==id;});});save();render();}
  else if(act==='add'){var nl=mkLift('l'+Date.now(),'New lift',20,2.5,3,5);nl.bar=S.bars[0].id;S.lifts.push(nl);save();render();window.scrollTo(0,document.body.scrollHeight);}
  else if(act==='addday'){S.days.push({id:'d'+Date.now(),name:'Workout '+(S.days.length+1),lifts:[]});save();render();}
  else if(act==='delday'){if(S.days.length<2)return;if(!sure())return;S.days=S.days.filter(function(x){return x.id!==id;});if(!dayOf(S.next)||S.next===id)S.next=S.days[0].id;save();render();}
  else if(act==='addbar'){S.bars.push({id:'b'+Date.now(),name:'Bar '+(S.bars.length+1),weight:20});save();render();}
  else if(act==='delbar'){if(!sure())return;S.bars=S.bars.filter(function(x){return x.id!==id;});save();render();}
  else if(act==='addplate'){S.plates.push({w:1,n:2});save();render();}
  else if(act==='delplate'){if(!sure())return;S.plates.splice(i,1);save();render();}
  else if(act==='copyexp'){copyFrom('exp',b);markBackup();}
  else if(act==='download')downloadBackup(b);
  else if(act==='calprev'){calM--;if(calM<0){calM=11;calY--;}render();}
  else if(act==='calnext'){calM++;if(calM>11){calM=0;calY++;}render();}
  else if(act==='calday'){var kk=b.getAttribute('data-k');calSel=calSel===kk?null:kk;render();}
  else if(act==='calclear'){calSel=null;render();}
  else if(act==='signin')signIn();
  else if(act==='signout')signOutNow();
  else if(act==='syncnow'){syncState='syncing';paintStatus();dirty?push():pull();}
  else if(act==='import')doImport();
});

function downloadBackup(b){

document.addEventListener('change',function(ev){
  var t=ev.target;
  if(t.id==='impfile'){

    var rd=new FileReader();rd.onload=function(){document.getElementById('imp').value=String(rd.result||'');doImport();};rd.readAsText(f);return;
  }
  var o=t.getAttribute('data-o');if(!o)return;
  var k=t.getAttribute('data-k'),path=t.getAttribute('data-f').split('.'),obj;
  if(o==='lift')obj=lift(k);
  else if(o==='day')obj=S.days.filter(function(x){return x.id===k;})[0];
  else if(o==='bar')obj=S.bars.filter(function(x){return x.id===k;})[0];
  else if(o==='plate')obj=S.plates[+k];
  else obj=S;
  if(!obj)return;
  var val;
  if(t.getAttribute('data-t')==='num'){
    val=parseFloat(t.value);
    if(!isFinite(val)){render();return;}
    var mn=t.getAttribute('data-min');if(mn!==null&&val<+mn)val=+mn;
    if(t.getAttribute('data-int'))val=Math.round(val);
  }else{val=t.value;if(path[0]==='name'&&!val.trim())val='Untitled';}
  for(var i=0;i<path.length-1;i++)obj=obj[path[i]];
  obj[path[path.length-1]]=val;
  if(o==='lift'&&path[0]==='prog'&&val==='double'){
    var l=lift(k);l.repsMin=l.reps;l.repsMax=Math.max(l.repsMax,l.reps+1);

  }
